name: Build Simple Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Web App Package
      run: |
        echo "Preparing web files for the app..."
        mkdir -p app-output
        cp index.html app-output/ || true
        cp original-index.html app-output/ || true

    - name: Upload Web Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Shimaa-App-Package
        path: app-output/
